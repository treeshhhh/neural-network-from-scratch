<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" role="img">
<title>Accuracy learning curves</title>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="28" font-family="sans-serif" font-size="20" >Accuracy learning curves</text>
<line x1="75" y1="330.0" x2="765" y2="330.0" stroke="#ddd"/>
<text x="65" y="334.0" font-family="sans-serif" font-size="13" text-anchor="end">0.00</text>
<line x1="75" y1="278.0" x2="765" y2="278.0" stroke="#ddd"/>
<text x="65" y="282.0" font-family="sans-serif" font-size="13" text-anchor="end">0.20</text>
<line x1="75" y1="226.0" x2="765" y2="226.0" stroke="#ddd"/>
<text x="65" y="230.0" font-family="sans-serif" font-size="13" text-anchor="end">0.40</text>
<line x1="75" y1="174.0" x2="765" y2="174.0" stroke="#ddd"/>
<text x="65" y="178.0" font-family="sans-serif" font-size="13" text-anchor="end">0.60</text>
<line x1="75" y1="122.0" x2="765" y2="122.0" stroke="#ddd"/>
<text x="65" y="126.0" font-family="sans-serif" font-size="13" text-anchor="end">0.80</text>
<line x1="75" y1="70.0" x2="765" y2="70.0" stroke="#ddd"/>
<text x="65" y="74.0" font-family="sans-serif" font-size="13" text-anchor="end">1.00</text>
<text x="75.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">1</text>
<text x="213.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">2</text>
<text x="351.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">3</text>
<text x="489.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">4</text>
<text x="627.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">5</text>
<text x="765.0" y="350" font-family="sans-serif" font-size="13" text-anchor="middle">6</text>
<text x="400" y="375" font-family="sans-serif" font-size="13" >Epoch (end-of-epoch evaluation)</text>
<polyline points="75.00,78.89 213.00,75.79 351.00,74.69 489.00,74.23 627.00,73.49 765.00,73.06" fill="none" stroke="#1465a4" stroke-width="2"/>
<text x="60" y="405" font-family="sans-serif" font-size="12" fill="#1465a4">numpy train</text>
<polyline points="75.00,81.83 213.00,78.06 351.00,77.93 489.00,77.46 627.00,78.22 765.00,77.51" fill="none" stroke="#d27413" stroke-width="2"/>
<text x="255" y="405" font-family="sans-serif" font-size="12" fill="#d27413">numpy validation</text>
<polyline points="75.00,79.11 213.00,75.92 351.00,75.09 489.00,74.41 627.00,74.00 765.00,72.64" fill="none" stroke="#31845b" stroke-width="2"/>
<text x="450" y="405" font-family="sans-serif" font-size="12" fill="#31845b">pytorch train</text>
